name: ProTrade Daily Autonomous Quant Run

on:
  schedule:
    # รันเวลา 22:00 UTC (ตรงกับ 05:00 น. เวลาไทย) ทุกวันจันทร์-ศุกร์ (ตรงกับเช้าวันอังคาร-เสาร์ของไทย หลังตลาดสหรัฐฯ ปิด)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'บังคับรันใหม่แม้วันทำการล่าสุดจะรันไปแล้ว (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-protrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ProTrade Quant Pipeline (Phase 0-6)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          python scripts/run_protrade.py

      - name: Commit and push updated data files
        run: |
          git config user.name "protrade-bot[bot]"
          git config user.email "protrade-bot[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): autonomous ProTrade update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
